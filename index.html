
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 450px;
            max-width: 100%;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        .input-group:focus-within {
            border-color: #4f46e5;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .domain {
            padding: 14px 10px;
            background: #f1f5f9;
            color: #555;
            font-size: 14px;
            white-space: nowrap;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .pass {
            display: block !important;
            background: #dcfce7;
            color: #15803d;
        }

        .fail {
            display: block !important;
            background: #fee2e2;
            color: #dc2626;
        }

        .error {
            display: block !important;
            background: #fef3c7;
            color: #92400e;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>EMAIL CHECKER</h1>

    <p class="description">
        Kiểm tra email nhận vé
    </p>

    <form id="emailForm">

        <label for="email">Địa chỉ Email</label>

        <div class="input-group">

            <input
                type="text"
                id="email"
                placeholder="Nhập tên email..."
                autocomplete="off"
            >

            <span class="domain">@gmail.com</span>

        </div>

        <button type="submit">
            KIỂM TRA EMAIL
        </button>

    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <div class="footer">
        Email Verification System
    </div>

</div>

// ========================================
// CHỨC NĂNG KIỂM TRA EMAIL
// ========================================

const form = document.getElementById("emailForm");
const emailInput = document.getElementById("email");
const result = document.getElementById("result");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    let email = emailInput.value.trim().toLowerCase();

    result.className = "";

    // Không cho phép bỏ trống
    if (email === "") {

        result.innerHTML = "⚠ Vui lòng nhập email!";
        result.classList.add("error");

        return;
    }

    // Tự thêm @gmail.com nếu người dùng không nhập tên miền
    if (!email.includes("@")) {

        email = email + "@gmail.com";

    }

    // Kiểm tra định dạng
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailRegex.test(email)) {

        result.innerHTML = "⚠ Email không đúng định dạng!";
        result.classList.add("error");

        return;
    }

    // Đối chiếu danh sách
    const exists = emailList.some(
        item => item.toLowerCase() === email
    );

    // Hiển thị kết quả
    if (exists) {

        result.innerHTML =
            "✓ PASS<br>Email tồn tại trong danh sách!<br>" + email;

        result.classList.add("pass");

    } else {

        result.innerHTML =
            "✕ FAIL<br>Email không tồn tại trong danh sách!<br>" + email;

        result.classList.add("fail");

    }

});
